<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compta Arif</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --panel2: #20242d; --text: #eef0f4; --muted: #9aa1ad;
    --accent: #4f8cff; --accent2: #2f6be0; --ok: #2fbf71; --danger: #ef5b5b; --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  header .dot.on { background: var(--ok); }
  .icon-btn { background: none; border: 0; color: var(--text); font-size: 20px; padding: 6px; cursor: pointer; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .moi { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .ia { align-self: flex-start; background: var(--panel2); border-bottom-left-radius: 6px; }
  .ia.err { border: 1px solid var(--danger); }
  .confirm { align-self: flex-start; background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; max-width: 90%; }
  .confirm .btns { display: flex; gap: 8px; margin-top: 10px; }
  .confirm button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-size: 15px; cursor: pointer; color: #fff; }
  .confirm .oui { background: var(--ok); } .confirm .non { background: #444b58; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 14px; padding: 4px 8px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 8px; max-width: 760px; width: 100%; margin: 0 auto; scrollbar-width: none; }
  .chip { flex: none; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 16px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
  footer { padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background: var(--panel); border-top: 1px solid var(--border); }
  .bar { display: flex; gap: 8px; align-items: center; max-width: 760px; margin: 0 auto; }
  .bar input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 22px; padding: 12px 16px; font-size: 16px; outline: none; }
  .round { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 20px; color: #fff; background: var(--accent); }
  .round.mic.rec { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,91,91,.6); } 50% { box-shadow: 0 0 0 10px rgba(239,91,91,0); } }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 16px; width: min(92vw, 420px); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  dialog input, dialog select { width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px; font-size: 16px; }
  dialog .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  dialog .row input { width: auto; }
  dialog .actions { display: flex; gap: 8px; margin-top: 16px; }
  dialog .actions button { flex: 1; padding: 10px; border-radius: 10px; border: 0; font-size: 15px; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; } .secondary { background: #444b58; color: #fff; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Compta Arif</h1>
  <button class="icon-btn" id="voixBtn" title="Lecture à voix haute">🔊</button>
  <button class="icon-btn" id="reglagesBtn" title="Réglages">⚙️</button>
</header>

<main id="fil"></main>

<div class="chips" id="chips"></div>
<footer>
  <form class="bar" id="form">
    <input id="saisie" placeholder="Pose ta question ou dicte une dépense…" autocomplete="off" enterkeyhint="send">
    <button type="button" class="round mic" id="micBtn" title="Parler">🎤</button>
    <button type="submit" class="round" title="Envoyer">➤</button>
  </form>
</footer>

<dialog id="reglages">
  <h3 style="margin:0">Réglages</h3>
  <label for="url">Adresse de l'API (Apps Script)</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <label for="pin">Code PIN</label>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <label for="voix">Voix</label>
  <select id="voix"></select>
  <div class="hint">Pour une voix plus humaine : sur iPhone, Réglages › Accessibilité › Contenu énoncé › Voix › Français, télécharge une voix « Premium » ou « Améliorée ». Sur PC, Microsoft Edge propose des voix « Natural ».</div>
  <label for="vitesse">Vitesse de la voix</label>
  <input id="vitesse" type="range" min="0.8" max="1.4" step="0.05">
  <div class="row"><input type="checkbox" id="auto"><span>Envoyer automatiquement après la dictée</span></div>
  <div class="actions">
    <button class="secondary" id="testVoix" type="button">Tester la voix</button>
    <button class="primary" id="enregistrer" type="button">Enregistrer</button>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('compta.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('compta.' + k, JSON.stringify(v)); } catch {} }
  };
  let reglages = store.get('reglages', { url: '', pin: '', voix: '', vitesse: 1.05, auto: true, parler: true });
  let historique = store.get('historique', []);
  const fil = $('fil');

  /* ---------- affichage ---------- */
  function bulle(texte, qui, classe) {
    const d = document.createElement('div');
    d.className = 'msg ' + qui + (classe ? ' ' + classe : '');
    d.textContent = texte;
    fil.appendChild(d);
    fil.scrollTop = fil.scrollHeight;
    return d;
  }
  function carteConfirmation(op) {
    const d = document.createElement('div');
    d.className = 'confirm';
    d.innerHTML = '<div></div><div class="btns"><button class="oui">Confirmer</button><button class="non">Annuler</button></div>';
    d.firstChild.textContent = op.resume;
    d.querySelector('.oui').onclick = async () => {
      d.querySelector('.btns').remove();
      const r = await api({ action: 'executer', operation: op });
      const t = r.ok ? '✅ ' + r.resultat : '❌ ' + r.erreur;
      bulle(t, 'ia', r.ok ? '' : 'err'); parler(r.ok ? 'C\'est fait.' : r.erreur);
    };
    d.querySelector('.non').onclick = () => { d.querySelector('.btns').remove(); bulle('Annulé.', 'ia'); };
    fil.appendChild(d); fil.scrollTop = fil.scrollHeight;
  }
  historique.slice(-20).forEach(h => bulle(h.text, h.role === 'user' ? 'moi' : 'ia'));
  if (!historique.length) bulle('Bonjour Arif ! Demande-moi par exemple « combien j\'ai dépensé en courses en espèces le mois dernier ? » ou « ajoute une dépense de 150 000 Ar en courses ».', 'ia');

  const suggestions = ['Combien en courses le mois dernier ?', 'Combien j\'ai dépensé en plaisirs sur mvola ?',
    'Combien il me restait fin mai ?', 'Mes 5 dernières dépenses', 'Combien j\'ai en espèces ?'];
  suggestions.forEach(s => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = s; b.onclick = () => envoyer(s); $('chips').appendChild(b); });

  /* ---------- API ---------- */
  async function api(corps) {
    if (!reglages.url || !reglages.pin) { $('reglages').showModal(); return { ok: false, erreur: 'Renseigne l\'adresse de l\'API et ton PIN dans les réglages.' }; }
    try {
      // text/plain évite la requête préalable CORS, que Apps Script ne gère pas
      const r = await fetch(reglages.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...corps, pin: reglages.pin }) });
      const j = await r.json(); $('dot').classList.toggle('on', !!j.ok); return j;
    } catch (e) { $('dot').classList.remove('on'); return { ok: false, erreur: 'Connexion impossible : ' + e.message }; }
  }

  async function envoyer(texte, audio) {
    texte = (texte || '').trim();
    if (!texte && !audio) return;
    stopParler();
    const maBulle = bulle(texte || '🎤 …', 'moi');
    $('saisie').value = '';
    const attente = document.createElement('div'); attente.className = 'typing'; attente.textContent = 'Je regarde dans tes comptes…'; fil.appendChild(attente);
    const r = await api({ action: 'discuter', message: texte, audio, historique: historique.slice(-8) });
    attente.remove();
    if (!r.ok) { bulle(r.erreur, 'ia', 'err'); return; }
    if (r.transcription) maBulle.textContent = r.transcription;
    const question = r.transcription || texte;
    bulle(r.reponse, 'ia'); parler(r.reponse);
    if (r.confirmation) carteConfirmation(r.confirmation);
    historique.push({ role: 'user', text: question }, { role: 'model', text: r.reponse });
    historique = historique.slice(-40); store.set('historique', historique);
  }
  $('form').onsubmit = e => { e.preventDefault(); envoyer($('saisie').value); };

  /* ---------- voix : synthèse ---------- */
  let voixDispo = [];
  function scoreVoix(v) {
    const n = v.name.toLowerCase(); let s = 0;
    if (/natural|premium|neural|enhanced|améliorée|amélioré|online/.test(n)) s += 10;
    if (/google/.test(n)) s += 4;
    if (/fr-fr/i.test(v.lang)) s += 2;
    return s;
  }
  function chargerVoix() {
    voixDispo = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)).sort((a, b) => scoreVoix(b) - scoreVoix(a));
    const sel = $('voix'); sel.innerHTML = '';
    voixDispo.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o); });
    if (reglages.voix) sel.value = reglages.voix;
  }
  if ('speechSynthesis' in window) { chargerVoix(); speechSynthesis.onvoiceschanged = chargerVoix; }
  function nettoyerPourVoix(t) {
    return t.replace(/\*+/g, '').replace(/\bAr\b/g, 'ariary').replace(/€/g, ' euros').replace(/(\d) (?=\d{3}\b)/g, '$1');
  }
  function parler(t) {
    if (!reglages.parler || !('speechSynthesis' in window) || !t) return;
    stopParler();
    const u = new SpeechSynthesisUtterance(nettoyerPourVoix(t));
    u.lang = 'fr-FR'; u.rate = Number(reglages.vitesse) || 1;
    const v = voixDispo.find(x => x.name === reglages.voix) || voixDispo[0];
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  }
  function stopParler() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function majVoixBtn() { $('voixBtn').textContent = reglages.parler ? '🔊' : '🔇'; }
  $('voixBtn').onclick = () => { reglages.parler = !reglages.parler; store.set('reglages', reglages); majVoixBtn(); if (!reglages.parler) stopParler(); };
  majVoixBtn();

  /* ---------- voix : reconnaissance ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = $('micBtn');
  let reco = null, enregistreur = null, morceaux = [];
  function finEcoute() { mic.classList.remove('rec'); }

  async function ecouterNatif() {
    reco = new SR(); reco.lang = 'fr-FR'; reco.interimResults = true; reco.continuous = false;
    let final = '';
    reco.onresult = e => {
      let t = ''; for (const r of e.results) t += r[0].transcript;
      $('saisie').value = t; if (e.results[e.results.length - 1].isFinal) final = t;
    };
    reco.onerror = e => { finEcoute(); reco = null; if (e.error === 'not-allowed' || e.error === 'service-not-allowed') ecouterEnregistrement(); };
    reco.onend = () => { finEcoute(); reco = null; const t = final || $('saisie').value; if (reglages.auto && t.trim()) envoyer(t); };
    reco.start(); mic.classList.add('rec');
  }

  // Secours : on enregistre l'audio et c'est Gemini qui le comprend (gratuit aussi)
  async function ecouterEnregistrement() {
    try {
      const flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm', 'audio/mp4', 'audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
      enregistreur = new MediaRecorder(flux, mime ? { mimeType: mime } : undefined); morceaux = [];
      enregistreur.ondataavailable = e => morceaux.push(e.data);
      enregistreur.onstop = async () => {
        flux.getTracks().forEach(t => t.stop()); finEcoute();
        const blob = new Blob(morceaux, { type: enregistreur.mimeType || 'audio/mp4' }); enregistreur = null;
        if (blob.size < 2000) return;
        const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
        envoyer('', { mime: blob.type.split(';')[0], data: b64 });
      };
      enregistreur.start(); mic.classList.add('rec');
    } catch (e) { finEcoute(); bulle('Micro indisponible : ' + e.message, 'ia', 'err'); }
  }

  mic.onclick = () => {
    stopParler();
    if (reco) { reco.stop(); return; }
    if (enregistreur) { enregistreur.stop(); return; }
    if (SR && !store.get('sansReconnaissanceNative', false)) {
      try { ecouterNatif(); } catch { ecouterEnregistrement(); }
    } else ecouterEnregistrement();
  };

  /* ---------- réglages ---------- */
  function ouvrirReglages() {
    $('url').value = reglages.url; $('pin').value = reglages.pin; $('vitesse').value = reglages.vitesse; $('auto').checked = reglages.auto;
    chargerVoix(); $('reglages').showModal();
  }
  $('reglagesBtn').onclick = ouvrirReglages;
  $('testVoix').onclick = () => { reglages.voix = $('voix').value; reglages.vitesse = Number($('vitesse').value); const p = reglages.parler; reglages.parler = true; parler('Bonjour Arif, ce mois-ci tu as dépensé 150 000 ariary en courses.'); reglages.parler = p; };
  $('enregistrer').onclick = () => {
    reglages = { ...reglages, url: $('url').value.trim(), pin: $('pin').value.trim(), voix: $('voix').value, vitesse: Number($('vitesse').value), auto: $('auto').checked };
    store.set('reglages', reglages); $('reglages').close(); api({ action: 'libelles' });
  };
  if (!reglages.url) ouvrirReglages(); else api({ action: 'libelles' });
})();
</script>
</body>
</html>
