<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="robots" content="noindex">
<title>Jarvis · Comptes</title>
<style>
  :root {
    --bg: #0f1220; --carte: #181c30; --texte: #eef0f8; --doux: #9aa1c0;
    --accent: #6c63ff; --ok: #3ecf8e; --err: #ff6b6b; --bord: #272c47;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  #etat { font-size: 13px; color: var(--doux); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icone { background: none; border: 0; font-size: 22px; padding: 6px; }

  main { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
  #zone-micro { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 4px; }
  #micro { width: 124px; height: 124px; border-radius: 50%; border: 0; font-size: 46px;
    background: var(--accent); box-shadow: 0 8px 30px rgba(108,99,255,.45); transition: transform .15s, background .2s; }
  #micro:active { transform: scale(.96); }
  #micro.ecoute { background: var(--err); animation: pulse 1.2s infinite; }
  #micro.reflechit { background: #4a4f7a; animation: tourne 1.4s linear infinite; }
  #micro.parle { background: var(--ok); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,107,.6); } 100% { box-shadow: 0 0 0 28px rgba(255,107,107,0); } }
  @keyframes tourne { 0% { opacity: 1; } 50% { opacity: .55; } 100% { opacity: 1; } }
  #live { min-height: 22px; color: var(--doux); font-size: 15px; text-align: center; }

  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 14px 16px; }
  #reponse { white-space: pre-wrap; font-size: 16px; line-height: 1.45; display: none; }
  #reponse.erreur { border-color: var(--err); }
  #chrono { font-size: 12px; color: var(--doux); margin-top: -6px; min-height: 14px; }
  #annuler { display: none; margin-top: 12px; background: transparent; border: 1px solid var(--bord);
    border-radius: 10px; padding: 8px 14px; }

  #pastilles { display: flex; flex-wrap: wrap; gap: 8px; }
  .pastille { background: var(--carte); border: 1px solid var(--bord); border-radius: 999px; padding: 8px 14px; font-size: 14px; }

  #saisie { display: flex; gap: 8px; }
  #texte { flex: 1; background: var(--carte); border: 1px solid var(--bord); color: var(--texte);
    border-radius: 12px; padding: 12px 14px; font-size: 16px; min-width: 0; }
  #envoyer { background: var(--accent); border: 0; border-radius: 12px; padding: 0 18px; font-size: 18px; }

  .options { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--doux); }
  .options label { display: flex; align-items: center; gap: 6px; }

  #historique { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--doux); }
  .ligne b { color: var(--texte); font-weight: 600; }

  /* Réglages */
  #reglages { position: fixed; inset: 0; background: var(--bg); padding: calc(env(safe-area-inset-top) + 16px) 16px 16px;
    display: none; overflow: auto; z-index: 10; }
  #reglages.ouvert { display: block; }
  #reglages .contenu { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  label.champ { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--doux); }
  input[type=text], input[type=password], input[type=url] { background: var(--carte); border: 1px solid var(--bord);
    color: var(--texte); border-radius: 12px; padding: 12px 14px; font-size: 16px; width: 100%; }
  .bouton { background: var(--accent); border: 0; border-radius: 12px; padding: 13px 16px; font-size: 16px; }
  .bouton.sec { background: var(--carte); border: 1px solid var(--bord); }
  #msg-reglages { min-height: 20px; font-size: 14px; }
  small { color: var(--doux); line-height: 1.4; }
</style>
</head>
<body>

<header>
  <h1>🎙️ Jarvis · Comptes</h1>
  <div>
    <span id="etat"></span>
    <button class="icone" id="ouvrir-reglages" aria-label="Réglages">⚙️</button>
  </div>
</header>

<main>
  <section id="zone-micro">
    <button id="micro" aria-label="Parler">🎤</button>
    <div id="live">Appuie sur le micro et parle.</div>
  </section>

  <section id="reponse" class="carte" aria-live="polite"></section>
  <div id="chrono"></div>
  <button id="annuler">↩️ Annuler cette ligne</button>

  <section id="pastilles">
    <button class="pastille" data-q="Combien il me reste en poche ?">👛 Solde poche</button>
    <button class="pastille" data-q="Quel est mon solde salaire ?">💼 Solde salaire</button>
    <button class="pastille" data-q="Combien j'ai dépensé en courses ce mois-ci ?">🧾 Courses du mois</button>
  </section>

  <section id="saisie">
    <input id="texte" type="text" placeholder="…ou écris ici (ex. sortie 5000 courses)" autocomplete="off" enterkeyhint="send">
    <button id="envoyer" aria-label="Envoyer">➤</button>
  </section>

  <section class="options">
    <label><input type="checkbox" id="voix" checked> Réponse vocale</label>
    <label><input type="checkbox" id="relire"> Relire avant d'envoyer</label>
  </section>

  <section id="historique"></section>
</main>

<div id="reglages">
  <div class="contenu">
    <h1>Réglages</h1>
    <small>Ces deux informations restent uniquement dans ce navigateur, sur cet appareil. Elles ne sont jamais écrites dans la page.</small>
    <label class="champ">Adresse du script (se termine par /exec, sans « ?s= »)
      <input id="champ-url" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    </label>
    <label class="champ">Mot de passe
      <input id="champ-pass" type="password" autocomplete="off">
    </label>
    <div id="msg-reglages"></div>
    <button class="bouton" id="sauver">Enregistrer et tester</button>
    <button class="bouton sec" id="fermer">Fermer</button>
    <button class="bouton sec" id="oublier">Effacer ces réglages de cet appareil</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- stockage local (protégé par try/catch) ---------- */
  var stock = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var rec = null, ecoute = false, occupe = false, dernierAnnul = null;

  /* ---------- interface ---------- */
  function etat(mode) {
    var m = $('#micro');
    m.className = '';
    if (mode) m.classList.add(mode);
    var txt = { ecoute: 'J\'écoute…', reflechit: 'Je réfléchis…', parle: 'Je réponds…' }[mode] || '';
    $('#etat').textContent = txt;
    m.textContent = mode === 'ecoute' ? '⏹' : mode === 'reflechit' ? '⏳' : mode === 'parle' ? '🔊' : '🎤';
  }

  function afficher(r) {
    var c = $('#reponse');
    c.style.display = 'block';
    c.textContent = r.text || '';
    c.className = 'carte' + (r.ok ? '' : ' erreur');
    var ch = '', d = r.diag;
    if (d) {
      var sec = function (ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' s'; };
      ch = (d.via === 'rapide' ? '⚡ sans IA' : '🧠 IA' + (d.modele ? ' (' + d.modele + ', ' + sec(d.msIA) + ')' : '')) +
           ' · script ' + sec(d.ms) + (r.total ? ' · total ' + sec(r.total) : '') + (r.essais > 1 ? ' · 2e essai' : '');
    }
    $('#chrono').textContent = ch;
    dernierAnnul = r.undoId || null;
    $('#annuler').style.display = dernierAnnul ? 'inline-block' : 'none';
  }

  function historique(q, r) {
    var h = $('#historique');
    var d = document.createElement('div');
    d.className = 'ligne';
    var b = document.createElement('b');
    b.textContent = '› ' + q;
    var s = document.createElement('div');
    s.textContent = (r.text || '').split('\n').slice(0, 2).join(' — ');
    d.appendChild(b); d.appendChild(s);
    h.insertBefore(d, h.firstChild);
    while (h.children.length > 6) h.removeChild(h.lastChild);
  }

  /* ---------- appel du script ---------- */
  // Un appel = une demande (rid) ; en cas de coupure ou de page d'erreur Google, on réessaie UNE fois avec le même rid
  // (le script reconnaît le rid et ne réécrit jamais deux fois la même ligne).
  function api(payload) {
    var url = stock.get('url'), pass = stock.get('pass');
    if (!url || !pass) { ouvrirReglages(); return Promise.reject(new Error('Renseigne d\'abord les réglages.')); }
    var rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var debut = performance.now();
    function essai(n) {
      return unAppel(url, Object.assign({ canal: 'web', pass: pass, rid: rid }, payload)).then(function (j) {
        j.total = performance.now() - debut; j.essais = n + 1; return j;
      }).catch(function (e) {
        if (e.reessayer && n < 1) return new Promise(function (ok) { setTimeout(ok, 1200); }).then(function () { return essai(n + 1); });
        throw e;
      });
    }
    return essai(0);
  }

  function unAppel(url, corps) {
    var statut = 0;
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, 45000);
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // évite la pré-requête CORS
      body: JSON.stringify(corps),
      redirect: 'follow',
      signal: ctrl.signal
    }).then(function (res) { statut = res.status; return res.text(); })
      .then(function (txt) {
        clearTimeout(t);
        try { return JSON.parse(txt); }
        catch (e) {
          var extrait = txt.replace(/<(style|script)[\s\S]*?<\/\1>/gi, ' ').replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim().slice(0, 180);
          var err = new Error('Google a répondu autre chose que prévu (code ' + statut + ') : « ' + extrait + ' »');
          err.reessayer = true;
          throw err;
        }
      })
      .catch(function (e) {
        clearTimeout(t);
        if (e.name === 'AbortError') throw new Error('Pas de réponse après 45 s. Réessaie ; si ça se répète, envoie-moi ce message.');
        if (e instanceof TypeError) { var e2 = new Error('Impossible de joindre le script (' + e.message + '). Vérifie ton réseau et l\'adresse.'); e2.reessayer = true; throw e2; }
        throw e;
      });
  }

  /* ---------- voix de sortie ---------- */
  function choisirVoix() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    var fr = vs.filter(function (v) { return /^fr/i.test(v.lang); });
    return fr.filter(function (v) { return /fr[-_]FR/i.test(v.lang); })[0] || fr[0] || null;
  }
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = function () {};

  function parler(texte) {
    if (!window.speechSynthesis || !texte) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texte);
    u.lang = 'fr-FR';
    var v = choisirVoix(); if (v) u.voice = v;
    u.onstart = function () { etat('parle'); };
    u.onend = u.onerror = function () { if (!occupe && !ecoute) etat(''); };
    speechSynthesis.speak(u);
  }

  /* ---------- envoi d'un message ---------- */
  function envoyer(texte) {
    texte = (texte || '').trim();
    if (!texte || occupe) return;
    occupe = true; etat('reflechit');
    $('#live').textContent = '« ' + texte + ' »';
    api({ action: 'message', texte: texte })
      .then(function (r) {
        afficher(r); historique(texte, r);
        occupe = false; etat('');
        if ($('#voix').checked && r.parle) parler(r.parle);
        if (r.auth === false) ouvrirReglages('Mot de passe refusé : corrige-le ci-dessous.');
      })
      .catch(function (e) {
        occupe = false; etat('');
        afficher({ ok: false, text: '⚠️ ' + e.message });
      });
  }

  /* ---------- reconnaissance vocale ---------- */
  function demarrerEcoute() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      afficher({ ok: false, text: '⚠️ Ce navigateur ne gère pas la reconnaissance vocale. Utilise Chrome, ou écris ton message.' });
      return;
    }
    if (window.speechSynthesis) speechSynthesis.cancel();
    rec = new SR();
    rec.lang = 'fr-FR';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    var final = '', erreur = null;

    rec.onresult = function (e) {
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else interim += t;
      }
      $('#live').textContent = (final + interim) || '…';
    };
    rec.onerror = function (e) {
      erreur = e.error;
      var m = {
        'not-allowed': 'Micro refusé : autorise le micro pour ce site (icône à gauche de l\'adresse).',
        'service-not-allowed': 'Micro refusé : autorise le micro pour ce site.',
        'no-speech': 'Je n\'ai rien entendu. Réessaie.',
        'audio-capture': 'Aucun micro détecté.',
        'network': 'La reconnaissance vocale a besoin d\'Internet.'
      }[e.error];
      if (m) afficher({ ok: false, text: '⚠️ ' + m });
    };
    rec.onend = function () {
      ecoute = false; etat('');
      var t = final.trim();
      if (!t) { if (!erreur) $('#live').textContent = 'Rien entendu. Réessaie.'; return; }
      if ($('#relire').checked) { $('#texte').value = t; $('#live').textContent = 'Vérifie le texte puis envoie ➤'; }
      else envoyer(t);
    };
    try { rec.start(); ecoute = true; etat('ecoute'); $('#live').textContent = '…'; }
    catch (e) { ecoute = false; etat(''); }
  }

  /* ---------- réglages ---------- */
  function ouvrirReglages(msg) {
    $('#champ-url').value = stock.get('url') || '';
    $('#champ-pass').value = stock.get('pass') || '';
    $('#msg-reglages').textContent = msg || '';
    $('#reglages').classList.add('ouvert');
  }
  function fermerReglages() { $('#reglages').classList.remove('ouvert'); }

  $('#ouvrir-reglages').onclick = function () { ouvrirReglages(); };
  $('#fermer').onclick = fermerReglages;
  $('#oublier').onclick = function () {
    stock.del('url'); stock.del('pass');
    $('#champ-url').value = ''; $('#champ-pass').value = '';
    $('#msg-reglages').textContent = 'Réglages effacés de cet appareil.';
  };
  $('#sauver').onclick = function () {
    var url = $('#champ-url').value.trim(), pass = $('#champ-pass').value;
    var msg = $('#msg-reglages');
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^?\s]+\/exec$/.test(url)) {
      msg.textContent = '⚠️ L\'adresse doit ressembler à https://script.google.com/macros/s/…/exec (sans « ?s= »).'; return;
    }
    if (!pass) { msg.textContent = '⚠️ Saisis le mot de passe.'; return; }
    stock.set('url', url); stock.set('pass', pass);
    msg.textContent = 'Test en cours…';
    api({ action: 'ping' })
      .then(function (r) {
        if (r.ok) { msg.textContent = '✅ Connexion OK.'; setTimeout(fermerReglages, 700); }
        else msg.textContent = '⚠️ ' + (r.text || 'Échec.');
      })
      .catch(function (e) { msg.textContent = '⚠️ ' + e.message; });
  };

  /* ---------- événements ---------- */
  $('#micro').onclick = function () {
    if (occupe) return;
    if (ecoute && rec) { rec.stop(); return; }
    demarrerEcoute();
  };
  $('#envoyer').onclick = function () { var t = $('#texte').value; $('#texte').value = ''; envoyer(t); };
  $('#texte').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#envoyer').click(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('.pastille'), function (p) {
    p.onclick = function () { envoyer(p.getAttribute('data-q')); };
  });
  $('#annuler').onclick = function () {
    if (!dernierAnnul || occupe) return;
    var id = dernierAnnul;
    occupe = true; etat('reflechit');
    api({ action: 'annuler', undoId: id })
      .then(function (r) {
        occupe = false; etat('');
        afficher(r);
        if ($('#voix').checked && r.parle) parler(r.parle);
      })
      .catch(function (e) { occupe = false; etat(''); afficher({ ok: false, text: '⚠️ ' + e.message }); });
  };

  if (stock.get('url') && stock.get('pass')) {   // réveille le script et mesure le temps de base (réseau + démarrage)
    api({ action: 'ping' }).then(function (r) {
      if (r && r.ok && !$('#chrono').textContent) $('#chrono').textContent = '📡 script joint en ' + (r.total / 1000).toFixed(1).replace('.', ',') + ' s';
    }).catch(function () {});
  }
  if (!stock.get('url') || !stock.get('pass')) ouvrirReglages('Première utilisation : renseigne l\'adresse du script et ton mot de passe.');
})();
</script>
</body>
</html>
